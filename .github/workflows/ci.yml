name: CI

on:
  push:
    branches:
      - main
      - master
      - "**github-workflow**"
  pull_request:
    branches:
      - main
      - master
      - "**github-workflow**"

jobs:
  secret_scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
