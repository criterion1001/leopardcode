name: Meterless Conformance

on:
  push:
    branches:
      - main
      - master
    paths:
      - "terminal/src/memory/**"
      - "backend/sponsor/**"
      - ".github/workflows/meterless-conformance.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "terminal/src/memory/**"
      - "backend/sponsor/**"
      - ".github/workflows/meterless-conformance.yml"
  workflow_dispatch:

jobs:
  hmem_conformance:
    name: H-MEM Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch the H-MEM engine spec
        run: npx -y degit meterless/meterless/engines/hmem#1742dec56a66e58eef9dda2d2b865823758ca8cd hmem-engine
      - name: Install the conformance runner
        working-directory: hmem-engine/reference
        run: npm install --no-audit --no-fund
      - name: Run the engine conformance suite
        working-directory: hmem-engine/reference
        run: HMEM_IMPL="$GITHUB_WORKSPACE/terminal/src/memory/index.ts" npx tsx ../conformance/runner.ts
