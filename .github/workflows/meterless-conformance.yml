name: Meterless Conformance

on:
  push:
    branches:
      - main
      - master
    paths:
      - "backend/sponsor/**"
      - ".github/workflows/meterless-conformance.yml"
  workflow_dispatch:

jobs:
  hmem_conformance:
    name: H-MEM Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch the H-MEM engine spec
        run: npx -y degit meterless/meterless/engines/hmem hmem-engine
      - name: Install the reference implementation
        working-directory: hmem-engine/reference
        run: npm install --no-audit --no-fund
      - name: Run the reference tests
        working-directory: hmem-engine/reference
        run: npm test
      - name: Run the conformance suite
        working-directory: hmem-engine/reference
        run: HMEM_IMPL="$GITHUB_WORKSPACE/hmem-engine/reference/src/index.ts" npx tsx ../conformance/runner.ts
