<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-label="leopardcode runtime topology: CLI and backend over Socket.IO with local tools and server-side agents"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E3A32F"/></marker><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B27C1C"/></marker></defs><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.2"><rect x="0" y="0" width="1120" height="580" rx="14" fill="#0F0D0A" stroke="#33291B" stroke-width="1.2"/><rect x="40" y="60" width="440" height="430" rx="10" fill="#17130E" stroke="#33291B" stroke-width="1.2"/><text x="64" y="92" font-size="15" fill="#F0E6D4" text-anchor="start" font-weight="600">terminal/ · leopardcode CLI</text><text x="64" y="112" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">Node 22 · Ink/React TUI</text><rect x="64" y="132" width="392" height="92" rx="10" fill="#14110C" stroke="#33291B" stroke-width="1.2"/><text x="84" y="158" font-size="13" fill="#F0E6D4" text-anchor="start" font-weight="600">user_config/config.json</text><text x="84" y="180" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">api_key · main_agent_id · sessions</text><text x="84" y="200" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">H-MEM memory in user_config/memory/</text><rect x="64" y="244" width="392" height="92" rx="10" fill="#14110C" stroke="#33291B" stroke-width="1.2"/><text x="84" y="270" font-size="13" fill="#F0E6D4" text-anchor="start" font-weight="600">tool executor</text><text x="84" y="292" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">file, shell and web tools run locally</text><text x="84" y="312" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">H-MEM recall before each prompt</text><rect x="64" y="356" width="392" height="110" rx="10" fill="#14110C" stroke="#33291B" stroke-width="1.2"/><text x="84" y="382" font-size="13" fill="#F0E6D4" text-anchor="start" font-weight="600">two-pane TUI</text><text x="84" y="404" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">chat + tasks · /model /key /memory /runs</text><text x="84" y="424" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">ten scripted /sample scenarios (web)</text><text x="84" y="448" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">works in the browser via ink-web</text><rect x="640" y="60" width="440" height="430" rx="10" fill="#17130E" stroke="#33291B" stroke-width="1.2"/><text x="664" y="92" font-size="15" fill="#F0E6D4" text-anchor="start" font-weight="600">backend/ · Python 3.13</text><text x="664" y="112" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">python-socketio ASGI app (Uvicorn)</text><rect x="664" y="132" width="392" height="92" rx="10" fill="#14110C" stroke="#33291B" stroke-width="1.2"/><text x="684" y="158" font-size="13" fill="#F0E6D4" text-anchor="start" font-weight="600">main agent (LangChain)</text><text x="684" y="180" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">processNewTask · executeCurrentTask</text><text x="684" y="200" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">checkRunningTasks · makeQuestion</text><rect x="664" y="244" width="392" height="92" rx="10" fill="#14110C" stroke="#33291B" stroke-width="1.2"/><text x="684" y="270" font-size="13" fill="#F0E6D4" text-anchor="start" font-weight="600">task graph per session</text><text x="684" y="292" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">pending · running · completed</text><text x="684" y="312" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">depends_on readiness · cascade blocked</text><rect x="664" y="356" width="392" height="110" rx="10" fill="#14110C" stroke="#33291B" stroke-width="1.2"/><text x="684" y="382" font-size="13" fill="#F0E6D4" text-anchor="start" font-weight="600">sub-agents (one per task)</text><text x="684" y="404" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">webSearch · webFetch · zetarisQuery</text><text x="684" y="424" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">file/shell forwarded to the CLI</text><text x="684" y="448" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">or run on the session's OCI folder (web)</text><path d="M 480 160 L 638 160" fill="none" stroke="#E3A32F" stroke-width="1.5" marker-end="url(#a)"/><text x="560" y="150" font-size="12" fill="#E3A32F" text-anchor="middle" font-weight="400">Socket.IO</text><text x="560" y="186" font-size="11" fill="#A28A67" text-anchor="middle" font-weight="400">events + ack</text><path d="M 638 420 L 480 420" fill="none" stroke="#B27C1C" stroke-width="1.5" marker-end="url(#ad)"/><text x="560" y="410" font-size="11" fill="#B27C1C" text-anchor="middle" font-weight="400">tool_request ⇄ tool_result</text><text x="560" y="446" font-size="11" fill="#A28A67" text-anchor="middle" font-weight="400">CLI executes</text><rect x="240" y="512" width="640" height="48" rx="8" fill="#14110C" stroke="#33291B" stroke-width="1.2" stroke-dasharray="6 4"/><text x="560" y="533" font-size="12" fill="#A28A67" text-anchor="middle" font-weight="400">models: NVIDIA NIM (your key) for 2–4 · DeepSeek Flash demo for 6</text><text x="560" y="551" font-size="12" fill="#A28A67" text-anchor="middle" font-weight="400">object storage: OCI bucket for web session files</text></g></svg>