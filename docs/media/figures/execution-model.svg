<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="Prompt to main agent to parallel categories to results turn"><defs><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E3A32F"/></marker><marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B27C1C"/></marker></defs><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.2"><rect x="0" y="0" width="1120" height="620" rx="14" fill="#0F0D0A" stroke="#33291B" stroke-width="1.2"/><rect x="40" y="120" width="160" height="64" rx="10" fill="#1B1710" stroke="#33291B" stroke-width="1.2"/><text x="56" y="146" font-size="12" fill="#B27C1C" text-anchor="start" font-weight="400" letter-spacing="0.08em">prompt</text><text x="56" y="168" font-size="14" fill="#F0E6D4" text-anchor="start" font-weight="400">user message</text><path d="M 200 152 L 240 152" fill="none" stroke="#E3A32F" stroke-width="1.5" marker-end="url(#arrow-accent)"/><rect x="244" y="76" width="380" height="180" rx="10" fill="#17130E" stroke="#33291B" stroke-width="1.2"/><text x="268" y="108" font-size="16" fill="#F0E6D4" text-anchor="start" font-weight="600">main agent (LangChain)</text><circle cx="272" cy="138" r="4" fill="#E3A32F"/><text x="288" y="142" font-size="13" fill="#F0E6D4" text-anchor="start" font-weight="400">processNewTask(categories)</text><circle cx="272" cy="166" r="4" fill="#E3A32F"/><text x="288" y="170" font-size="13" fill="#F0E6D4" text-anchor="start" font-weight="400">executeCurrentTask()</text><circle cx="272" cy="194" r="4" fill="#E3A32F"/><text x="288" y="198" font-size="13" fill="#F0E6D4" text-anchor="start" font-weight="400">checkRunningTasks()</text><text x="268" y="230" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">categories = {name, tasks, depends_on}</text><path d="M 434 256 L 434 300" fill="none" stroke="#E3A32F" stroke-width="1.5" marker-end="url(#arrow-accent)"/><rect x="244" y="310" width="836" height="240" rx="10" fill="#14110C" stroke="#33291B" stroke-width="1.2" stroke-dasharray="7 5"/><text x="268" y="340" font-size="14" fill="#F0E6D4" text-anchor="start" font-weight="600">detached background pass</text><rect x="280" y="372" width="320" height="86" rx="8" fill="#231A07" stroke="#E3A32F" stroke-width="1.3"/><text x="300" y="400" font-size="15" fill="#F0E6D4" text-anchor="start" font-weight="600">ready category</text><text x="300" y="424" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">fresh sub-agent per task</text><text x="300" y="446" font-size="12" fill="#E3A32F" text-anchor="start" font-weight="400">runs in parallel</text><rect x="700" y="372" width="320" height="86" rx="8" fill="#231A07" stroke="#E3A32F" stroke-width="1.3"/><text x="720" y="400" font-size="15" fill="#F0E6D4" text-anchor="start" font-weight="600">ready category</text><text x="720" y="424" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">fresh sub-agent per task</text><text x="720" y="446" font-size="12" fill="#E3A32F" text-anchor="start" font-weight="400">dispatched from depends_on</text><rect x="470" y="486" width="300" height="52" rx="8" fill="#17130E" stroke="#E3A32F" stroke-width="1.2"/><text x="620" y="517" font-size="14" fill="#F0E6D4" text-anchor="middle" font-weight="400">results turn</text><path d="M 440 458 L 545 486" fill="none" stroke="#B27C1C" stroke-width="1.4" marker-end="url(#arrow-dim)"/><path d="M 860 458 L 695 486" fill="none" stroke="#B27C1C" stroke-width="1.4" marker-end="url(#arrow-dim)"/><path d="M 770 512 C 1060 512 1060 152 630 152" fill="none" stroke="#E3A32F" stroke-width="1.4" marker-end="url(#arrow-accent)" stroke-dasharray="5 5"/><text x="1052" y="244" font-size="12" fill="#A28A67" text-anchor="end" font-weight="400">results delivered</text><text x="1052" y="262" font-size="12" fill="#A28A67" text-anchor="end" font-weight="400">as a new message</text><text x="244" y="582" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">File and shell tools run inside the sub-agent — on your machine for the CLI, on the session's OCI folder for web.</text><text x="244" y="602" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">webSearch and webFetch always run on the backend.</text></g></svg>