 the plan</text><path d="M 912 380 L 208 380" fill="none" stroke="#B27C1C" stroke-width="1.5" marker-end="url(#ad)"/><text x="560.0" y="372" font-size="12" fill="#B27C1C" text-anchor="middle" font-weight="400">subagent_response · task_update</text><path d="M 912 440 L 208 440" fill="none" stroke="#B27C1C" stroke-width="1.5" marker-end="url(#ad)"/><text x="560.0" y="432" font-size="12" fill="#B27C1C" text-anchor="middle" font-weight="400">tool_request (CLI executes)</text><path d="M 208 470 L 912 470" fill="none" stroke="#E3A32F" stroke-width="1.5" marker-end="url(#a)"/><text x="560.0" y="462" font-size="12" fill="#E3A32F" text-anchor="middle" font-weight="400">tool_result</text><path d="M 912 560 L 208 560" fill="none" stroke="#B27C1C" stroke-width="1.5" marker-end="url(#ad)"/><text x="560.0" y="552" font-size="12" fill="#B27C1C" text-anchor="middle" font-weight="400">main_agent_response</text><path d="M 912 610 L 208 610" fill="none" stroke="#B27C1C" stroke-width="1.5" marker-end="url(#ad)"/><text x="560.0" y="602" font-size="12" fill="#B27C1C" text-anchor="middle" font-weight="400">results turn → main_agent_response</text><text x="560.0" y="225" font-size="12" fill="#A28A67" text-anchor="middle" font-weight="400">invokeMainAgent → parallel tool calls: processNewTask + executeCurrentTask</text><text x="560.0" y="325" font-size="12" fill="#A28A67" text-anchor="middle" font-weight="400">background pass starts; one sub-agent per ready category</text><text x="560.0" y="505" font-size="12" fill="#A28A67" text-anchor="middle" font-weight="400">web sessions run the tool server-side on the OCI folder</text></g></svg>