xt><text x="560.0" y="130" font-size="12" fill="#A28A67" text-anchor="middle" font-weight="400">main agent calls makeQuestion (2–5 options per question)</text><text x="560.0" y="230" font-size="12" fill="#A28A67" text-anchor="middle" font-weight="400">client walks the questions one at a time and adds a free-text option</text><text x="560.0" y="320" font-size="12" fill="#A28A67" text-anchor="middle" font-weight="400">enqueue QUESTIONNAIRE turn → processNewTask → executeCurrentTask</text></g></svg>