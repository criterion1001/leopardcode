<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-label="leopardcode web workspace layout: terminal, file explorer and file viewer panes"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E3A32F"/></marker><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B27C1C"/></marker></defs><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.2"><rect x="0" y="0" width="1120" height="380" rx="14" fill="#0F0D0A" stroke="#33291B" stroke-width="1.2"/><rect x="40" y="40" width="1040" height="44" rx="10" fill="#17130E" stroke="#33291B" stroke-width="1.2"/><text x="60" y="68" font-size="13" fill="#E3A32F" text-anchor="start" font-weight="700" letter-spacing="0.08em">LEOPARDCODE</text><text x="1060" y="68" font-size="12" fill="#A28A67" text-anchor="end" font-weight="400">session folder</text><rect x="40" y="104" width="340" height="210" rx="10" fill="#17130E" stroke="#33291B" stroke-width="1.2"/><text x="60" y="136" font-size="14" fill="#F0E6D4" text-anchor="start" font-weight="600">terminal</text><text x="60" y="158" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">Ink app via ink-web</text><circle cx="64" cy="190" r="3" fill="#E3A32F"/><text x="78" y="194" font-size="12" fill="#F0E6D4" text-anchor="start" font-weight="400">chat + tasks panes</text><circle cx="64" cy="216" r="3" fill="#E3A32F"/><text x="78" y="220" font-size="12" fill="#F0E6D4" text-anchor="start" font-weight="400">/model  /key  /sample</text><rect x="400" y="104" width="340" height="210" rx="10" fill="#17130E" stroke="#33291B" stroke-width="1.2"/><text x="420" y="136" font-size="14" fill="#F0E6D4" text-anchor="start" font-weight="600">file explorer</text><text x="420" y="158" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">session OCI folder</text><circle cx="424" cy="190" r="3" fill="#E3A32F"/><text x="438" y="194" font-size="12" fill="#F0E6D4" text-anchor="start" font-weight="400">tree of session files</text><circle cx="424" cy="216" r="3" fill="#E3A32F"/><text x="438" y="220" font-size="12" fill="#F0E6D4" text-anchor="start" font-weight="400">select to open</text><rect x="740" y="104" width="340" height="210" rx="10" fill="#17130E" stroke="#33291B" stroke-width="1.2"/><text x="760" y="136" font-size="14" fill="#F0E6D4" text-anchor="start" font-weight="600">file viewer</text><text x="760" y="158" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">selected file</text><circle cx="764" cy="190" r="3" fill="#E3A32F"/><text x="778" y="194" font-size="12" fill="#F0E6D4" text-anchor="start" font-weight="400">syntax highlight</text><circle cx="764" cy="216" r="3" fill="#E3A32F"/><text x="778" y="220" font-size="12" fill="#F0E6D4" text-anchor="start" font-weight="400">size and truncation</text><text x="40" y="348" font-size="12" fill="#A28A67" text-anchor="start" font-weight="400">The browser never holds OCI credentials; the backend reads and writes the session bucket.</text></g></svg>